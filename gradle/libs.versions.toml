[versions]
compileSdk = "36"
minSdk = "24"
targetSdk = "36"
versionCode = "14003"
versionName = "1.4.2"
kotlin = "2.0.0"
compose = "1.3.3"
room = "2.4.0"

[libraries]
compose-runtime = { group = "androidx-compose-runtime", name = "runtime", version.ref = "compose"}
compose-runtime-livedata = { group = "androidx-compose-runtime", name = "runtime-livedata", version.ref = "compose"}
compose-runtime-rxjava2 = { group = "androidx-compose-runtime", name = "runtime-rxjava2", version.ref = "compose"}
compose-ui = { group = "androidx.compose.ui", name = "ui", version.ref = "compose"}
compose-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview", version.ref = "compose"}


room-runtime = { group = "androidx.room", name = "room-runtime", version.ref = "room"}
room-rxjava2 = { group = "androidx.room", name = "room-rxjava2", version.ref = "room"}
room-ktx =  { group = "androidx.room", name = "room-ktx", version.ref = "room"}

[plugins]
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[bundles]
compose-runtime-all = ["compose-runtime", "compose-runtime-livedata", "compose-runtime-rxjava2"]
compose-ui-all = ["compose-ui", "compose-ui-tooling-preview"]
room-all = ["room-ktx", "room-runtime", "room-rxjava2"]
